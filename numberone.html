<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Headline</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Syne:wght@400;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0a;
  --text: #f0ede6;
  --accent: #c8a96e;
}

body {
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Syne', sans-serif;
}

/* Optional subtle noise texture */
.noise {
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 1;
  opacity: 0.4;
}

.hero {
  position: relative;
  z-index: 2;
  text-align: left;
  padding: 0 8vw;
  max-width: 1100px;
  width: 100%;
}

.line-wrapper {
  overflow: hidden;
  display: block;
  padding-bottom: 0.1em;
}

.line-1 {
  font-size: clamp(0.8rem, 1.2vw, 1.1rem);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 1.2rem;
}

.line-2,
.line-3,
.line-4 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(3.5rem, 8vw, 8rem);
  line-height: 0.95;
  margin-bottom: 0.2rem;
}

.line-2 { font-weight: 900; color: var(--text); }

.line-3 {
  font-weight: 700;
  font-style: italic;
  color: transparent;
  -webkit-text-stroke: 1.5px var(--text);
}

.line-4 { font-weight: 900; color: var(--text); }

.line-4 .accent-word {
  color: var(--accent);
}

.word {
  display: inline-block;
  overflow: hidden;
}

.word-inner {
  display: inline-block;
}

.deco-line {
  width: 0;
  height: 1px;
  background: var(--accent);
  margin-top: 3rem;
  opacity: 0.5;
}
</style>
</head>

<body>

<div class="noise"></div>

<section class="hero">
  <div class="line-wrapper">
    <div class="line-1" id="tagline">— Crafting digital experiences since 2024</div>
  </div>
  <div class="line-wrapper">
    <div class="line-2" id="h1">We build sharp,</div>
  </div>
  <div class="line-wrapper">
    <div class="line-3" id="h2">standout brands</div>
  </div>
  <div class="line-wrapper">
    <div class="line-4" id="h3">that <span class="accent-word">endure.</span></div>
  </div>
  <div class="deco-line" id="deco"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
function splitWords(el) {
  const words = el.textContent.split(" ");
  el.innerHTML = words.map(word =>
    `<span class="word"><span class="word-inner">${word}</span></span>`
  ).join(" ");
  return el.querySelectorAll(".word-inner");
}

const h1Words = splitWords(document.getElementById('h1'));
const h2Words = splitWords(document.getElementById('h2'));
const h3Words = splitWords(document.getElementById('h3'));

const tl = gsap.timeline();

tl.from('#tagline', {
  y: '110%',
  opacity: 0,
  duration: 0.8,
  ease: 'expo.out'
})

.from(h1Words, {
  y: '130%',
  opacity: 0,
  duration: 1,
  stagger: 0.06,
  ease: 'expo.out'
}, "-=0.4")

.from(h2Words, {
  y: '130%',
  opacity: 0,
  duration: 1,
  stagger: 0.07,
  ease: 'expo.out'
}, "-=0.6")

.from(h3Words, {
  y: '130%',
  opacity: 0,
  duration: 1,
  stagger: 0.08,
  ease: 'expo.out'
}, "-=0.7")

.to('#deco', {
  width: '6rem',
  duration: 1,
  ease: 'power4.out'
}, "-=0.8");
</script>

</body>
</html>
