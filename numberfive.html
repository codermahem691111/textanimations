<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Fill Animation</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0a0a0a;
  font-family: 'Bebas Neue', sans-serif;
}

/* ---------------- HERO SECTION ---------------- */

.hero {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.hero-text {
  font-size: clamp(5rem, 14vw, 12rem);
  color: white;
  letter-spacing: 0.05em;
  text-align: center;
}

/* Scroll arrow */
.scroll-down {
  position: absolute;
  bottom: 3rem;
  font-size: 0.9rem;
  letter-spacing: 0.3em;
  color: rgba(255,255,255,0.3);
  animation: float 2s ease-in-out infinite;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(10px); }
}

/* ---------------- TEXT FILL SECTION ---------------- */

.section-fill {
  min-height: 200vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.text-container {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.05em;
  padding: 2rem;
}

.fill-text {
  font-size: clamp(4rem, 12vw, 10rem);
  letter-spacing: 0.04em;
  line-height: 1;

  color: transparent;
  -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.25);

  background-image: linear-gradient(to right, #ffffff, #ffffff);
  background-size: 0% 100%;
  background-repeat: no-repeat;
  -webkit-background-clip: text;
  background-clip: text;

  will-change: background-size;
}

</style>
</head>
<body>

<!-- HERO -->
<section class="hero">
  <div class="hero-text">Scroll down ⬇️</div>
  <div class="scroll-down">SCROLL</div>
</section>

<!-- FILL TEXT SECTION -->
<section class="section-fill">
  <div class="text-container">
    <div class="fill-text" id="line1">ABOUT ME</div>
    <div class="fill-text" id="line2">HOW DO I WORK</div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

// Fill animation
gsap.to(['#line1', '#line2'], {
  backgroundSize: '100% 100%',
  ease: 'none',
  scrollTrigger: {
    trigger: '.text-container',
    start: 'top 80%',
    end: 'top 40%',
    scrub: 0.5
  }
});
</script>

</body>
</html>
