<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GSAP Letter Animation</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #080808;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Bebas Neue', sans-serif;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .scene {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      width: 100vw;
      /* clip letters flying in from the right */
      overflow: hidden;
    }

    .line {
      display: block;
      white-space: nowrap;
    }

    .line-1 {
      font-size: clamp(3rem, 10vw, 9rem);
      color: #f0ece3;
      letter-spacing: 0.08em;
      line-height: 1.15;
    }

    .line-2 {
      font-size: clamp(1.2rem, 3.5vw, 3rem);
      color: #c0a882;
      letter-spacing: 0.28em;
      line-height: 1.3;
      margin-top: 0.3em;
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      text-transform: uppercase;
    }

    .char {
      display: inline-block;
      opacity: 0;
      transform-origin: center center;
    }

    .accent-line {
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c0a882, transparent);
      margin: 1.4rem auto 0;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="scene">
    <span class="line line-1" id="line1">MOTION IS LIFE</span>
    <span class="line line-2" id="line2">every frame tells a story</span>
    <div class="accent-line" id="accent"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    function splitChars(el) {
      const text = el.textContent;
      el.textContent = '';
      [...text].forEach(ch => {
        const span = document.createElement('span');
        span.className = 'char';
        span.textContent = ch === ' ' ? '\u00A0' : ch;
        el.appendChild(span);
      });
      return el.querySelectorAll('.char');
    }

    const chars1 = splitChars(document.getElementById('line1'));
    const chars2 = splitChars(document.getElementById('line2'));
    const accent = document.getElementById('accent');

    // Each letter starts from the far right edge of the viewport
    const startX = window.innerWidth;

    // Set BOTH lines: invisible, far right, scaled up large
    gsap.set([chars1, chars2], {
      opacity: 0,
      x: startX,
      scale: 2.5,
      transformOrigin: 'center center'
    });

    const tl = gsap.timeline({ defaults: { ease: 'expo.out' } });

    // LINE 1 — right edge → final position, shrinks + fades in, letter by letter
    tl.to(chars1, {
      opacity: 1,
      x: 0,
      scale: 1,
      duration: 1.2,
      stagger: 0.06,
    })
    // LINE 2 — identical animation, kicks off before line 1 finishes
    .to(chars2, {
      opacity: 1,
      x: 0,
      scale: 1,
      duration: 1.2,
      stagger: 0.05,
    }, '-=0.6')
    // accent underline sweeps in
    .to(accent, {
      width: '55%',
      opacity: 1,
      duration: 0.9,
      ease: 'power3.out'
    }, '-=0.4');
  </script>
</body>
</html>
